name: GlowBook CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glowbook-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run application specs with an isolated database
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Check service worker caching and offline language
        run: node --test spec/javascript/*_test.cjs
      - name: Scan Rails code
        run: docker compose -f compose.test.yaml run --rm --no-deps tests bundle exec brakeman --no-pager --quiet
      - name: Check routes, templates, and translations
        run: docker compose -f compose.test.yaml run --rm --no-deps tests ./bin/rails runner script/check_release.rb
      - name: Build production image
        run: docker build -t glowbook:ci .
      - name: Validate production HTTPS proxy configuration
        run: |
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet
          docker run --rm -e APP_HOST=https://glowbook.example.com --mount type=bind,source="$PWD/deploy/caddy",target=/etc/caddy,readonly caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Clean up verification containers
        if: always()
        run: docker compose -f compose.test.yaml down --remove-orphans --volumes
