<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#d94678">
    <title>Offline — GlowBook</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7fa;color:#27212a;font:16px/1.6 system-ui,sans-serif}
      main{max-width:28rem;padding:2rem;text-align:center}h1{margin:.5rem 0;color:#be185d;font-size:1.7rem}p{color:#625866}.mark{font-size:2.5rem}
      button{margin-top:1rem;padding:.75rem 1.25rem;border:0;border-radius:.75rem;background:#d94678;color:white;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✿</div>
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini perlu koneksi internet. Sambungkan kembali lalu coba muat ulang.</p>
      <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
